name: Python Package using Anaconda

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-conda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: markitdown-cli
        auto-activate-base: false

    - name: Install package and tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install -e ".[dev]"

    - name: Lint (errors only)
      run: |
        flake8 doc2md tests converter.py gui.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Tests
      run: pytest -q

    - name: CLI smoke
      run: |
        python converter.py --check
        python converter.py --help
