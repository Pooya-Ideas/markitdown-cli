# This workflow will install Python dependencies, run lint and basic smoke tests
# for multiple Python versions.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install "markitdown[docx,pptx,xlsx,pdf]" undoc pymupdf python-bidi

    - name: Lint with flake8
      run: |
        # Stop on syntax errors / undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__
        # Soft warnings only
        flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics --exclude=.git,__pycache__

    - name: Smoke import tests
      run: |
        python -c "import converter; print('converter OK')"
        python -c "import gui; print('gui OK')"
        python converter.py --help

    - name: Syntax check batch entry points exist
      shell: bash
      run: |
        test -f run.bat
        test -f gui.bat
        test -f install.bat
        test -f check.bat
        echo "Batch files present"
